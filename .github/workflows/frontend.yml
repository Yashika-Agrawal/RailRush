name: RailRush Deployment

on:
  push:
    branches:
      - main

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/railrush:latest
            ${{ vars.DOCKERHUB_USERNAME }}/railrush:1.0

  deploy:
    runs-on: self-hosted
    needs: docker-build-push

    steps:
      - name: Pull latest code
        run: |
          cd /home/ubuntu/RailRush
          git pull

      - name: Install dependencies
        run: |
          cd /home/ubuntu/RailRush/frontend
          npm ci

      - name: Build frontend
        run: |
          cd /home/ubuntu/RailRush/frontend
          npm run build

      - name: Deploy to Nginx
        run: |
          sudo cp -r /home/ubuntu/RailRush/frontend/dist/. /var/www/railrush/
          sudo systemctl reload nginx
